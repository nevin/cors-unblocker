<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CORS Unblocker</title>
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <img class="header__icon" src="../assets/icon.svg" alt="" width="28" height="28" />
        <div class="header__text">
          <h1>CORS Unblocker</h1>
          <p id="status-line" class="status-line" aria-live="polite">Loading…</p>
        </div>
        <label class="power">
          <span id="power-label" class="power__label">Off</span>
          <span class="switch">
            <input id="enabled" type="checkbox" aria-label="CORS overrides" aria-describedby="status-line" />
            <span aria-hidden="true"></span>
          </span>
        </label>
      </header>

      <p id="global-warning" class="global-warning" role="alert" hidden>
        Global mode: every website gets relaxed CORS.
        <button id="leave-global" type="button" class="link-button">Trust pages only</button>
      </p>

      <section id="page-card" class="card" aria-labelledby="card-title" aria-live="polite">
        <h2 id="card-title" class="card__title">Checking this page…</h2>
        <p id="card-text" class="card__text"></p>
        <ul id="issue-list" class="issue-list" hidden></ul>
        <details id="fix-details" class="fix-details" hidden>
          <summary>What will change</summary>
          <ul id="fix-list" class="fix-list"></ul>
        </details>
        <button id="primary-action" type="button" class="card__primary" hidden></button>
        <button id="secondary-action" type="button" class="link-button" hidden></button>
      </section>

      <p id="notice" class="notice" role="status" aria-live="polite"></p>

      <footer class="footer">
        <button id="pause" type="button" class="link-button" hidden>Pause 1 hour</button>
        <button id="open-settings" type="button" class="link-button">Settings</button>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
